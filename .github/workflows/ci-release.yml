name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: server/go.mod

      - name: Run unit tests
        working-directory: server
        run: go test -v ./...

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: server/go.mod

      - name: Build binary
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          RAW_BIN="kb-server${{ matrix.ext }}"
          TARGET_BIN="kb-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          
          # Build with symbol stripping for smaller footprint
          go build -trimpath -ldflags="-s -w" -o "${RAW_BIN}" .

          DIST_DIR="dist"
          mkdir -p "${DIST_DIR}"

          # Copy standalone binary
          cp "${RAW_BIN}" "${DIST_DIR}/${TARGET_BIN}"

          # Package archive
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -9 "${DIST_DIR}/kb-server-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "${RAW_BIN}"
          else
            tar -czvf "${DIST_DIR}/kb-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${RAW_BIN}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat << 'BODY' > release_notes.md
          ## Knowledge Base Multi-Portal Server (kb-server)

          ### Highlights:
          - **Multi-Portal Architecture**: Serve different portal slices (`INDEX.md`, `AGENTS.md`, `filelist.txt`, `uploads/`) from a single master knowledge base.
          - **S3-Style Dual Bucketing**: Access via Path-Style (`/{portal}/...`) or Domain-Style (virtual host subdomain or custom `domain.txt`).
          - **Strict Boundary Whitelist**: Access and RAG search are strictly restricted to paths matching `filelist.txt`.
          - **Fixed Upload Entrance**: Built-in lesson/experience upload endpoint (`POST /{portal}/upload`) saving directly to portal `uploads/`.
          - **Pure Go & Zero External Dependencies**: Ultra-lightweight standalone binary with no Python or third-party dependencies required.

          ### Quick Start:
          ```bash
          # Run with custom ports and directories
          ./kb-server -port 8080 -listen 0.0.0.0 -kb /path/to/kb -portals /path/to/kb/portals
          ```
          BODY

          if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" = "main" ]; then
            TAG_NAME="v$(date +'%Y%m%d%H%M%S')"
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

          gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "${TAG_NAME}" \
              --notes-file release_notes.md
